spring.application.name=backend

# Server
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ecommercedb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Email Configuration 
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=shopease.app@gmail.com
spring.mail.password=ton_mot_de_passe_application
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# JWT Configuration
jwt.secret=ecommerceSecretKey2024JWTTokenSpringBootVeryLongSecretKey1234567890
jwt.expiration=86400000

# Admin fixed credentials
admin.matricule=ADMIN001
admin.password=Admin@123

# Logging
logging.level.com.ecommerce.backend=DEBUG
logging.level.org.springframework.security=DEBUG

# Rate Limiting Configuration
rate.limit.max-attempts-per-minute=5
rate.limit.max-failed-attempts=10
rate.limit.block-duration-minutes=30

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
management.metrics.export.simple.enabled=true

# Alert email recipient
alert.email.to=nour.chatti@sitic.ucar.tn